<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopedpee</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="../styles/Home.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <script type="module">
      import { getCurrentUser, logout } from "../script/auth/auth.js";
      const user = getCurrentUser();
      if (!user) window.location.href = "./Login.html";
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("user-display").textContent = user.email;
        document.getElementById("logout-btn").onclick = () => {
          logout();
          window.location.reload();
        };

        // Toggle Cart Modal
        const cartBtn = document.getElementById("cart-toggle");
        const cartDrawer = document.getElementById("cart-drawer");
        cartBtn.onclick = () => cartDrawer.showModal();
        window.closeCart = () => cartDrawer.close();
      });
    </script>
  </head>

  <body>
    <!-- <header class="glass-header">
      <div class="header-content">
        <h1 class="logo">EDP<span>Shop</span></h1>
        <div class="header-right">
          <span id="user-display"></span>
          <button id="cart-toggle" class="icon-btn">
            <span class="material-symbols-outlined">shopping_cart</span>
          </button>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </div>
    </header> -->

    <header class="header" id="home-header">
      <nav class="header-content">
        <div class="nav-upper">
          <div class="profile-container">
            <span class="material-symbols-outlined" id="profile-logo"
              >account_circle</span
            >
            <h4 id="nav-username">Test Username</h4>
          </div>
        </div>

        <div class="nav-lower">
          <div class="nav-logo">
            <img src="/public/images/shopee-icon-white.png" alt="Logo Image" />
            <h1 class="logo">Shop<span>edp</span>ee</h1>
          </div>

          <div class="nav-search">
            <form action="" class="nav-search-form">
              <div class="search-container">
                <input
                  id="search-input"
                  name="search-input"
                  type="text"
                  placeholder="Search products"
                />
                <button type="submit" class="search-btn">
                  <span class="material-symbols-outlined">search</span>
                </button>
              </div>
            </form>
          </div>

          <a href="Cart.html" class="nav-cart">
            <span class="material-symbols-outlined" id="cart-icon"
              >shopping_cart</span
            >
            <span class="badge" id="cart-badge">2</span>
          </a>
        </div>
      </nav>
    </header>

    <main class="shop-container">
      <section class="filter-bar glass">
        <form class="price-filter-container">
          <span>Filter by Price:</span>
          <input type="number" id="min-price" placeholder="₱ Min" />
          <input type="number" id="max-price" placeholder="₱ Max" />
          <button type="submit" class="btn-primary">Apply</button>
        </form>
      </section>

      <div id="product-grid" class="product-grid"></div>
    </main>

    <dialog id="cart-drawer" class="glass-modal">
      <div class="modal-header">
        <h3>Your Cart</h3>
        <button onclick="closeCart()" class="close-btn">&times;</button>
      </div>
      <div id="cart-items" class="cart-list"></div>
      <div class="cart-footer">
        <h4 id="total-price">Total: ₱0</h4>
        <button class="btn-checkout" onclick="handleCheckout()">
          PROCEED TO CHECKOUT
        </button>
      </div>
    </dialog>

    <dialog id="checkout-dialog" class="custom-modal"></dialog>

    <script type="module" src="../script/shop/ui-handler.js"></script>
  </body>
</html>
